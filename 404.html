<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0f" />
    <title>404 | The Student Lounge</title>
    <style>
      :root { color-scheme: dark; font-family: "DM Sans", system-ui, sans-serif; background: #080a0f; color: #f7f8fb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #080a0f; }
      main { width: min(100%, 760px); text-align: center; }
      img { display: block; width: min(100%, 620px); margin: 0 auto 24px; border-radius: 18px; box-shadow: 0 24px 70px rgba(0, 0, 0, .4); }
      a { display: inline-flex; align-items: center; justify-content: center; padding: 13px 18px; border-radius: 999px; color: #080a0f; background: #f7f8fb; font-size: .9rem; font-weight: 700; text-decoration: none; }
      a:hover { background: #1683ff; color: white; }
    </style>
  </head>
  <body>
    <main>
      <img src="404-image.png" alt="The Student Lounge 404 page not found artwork" />
      <a href="./">Back to The Student Lounge</a>
    </main>
  </body>
</html>
